<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Supabase 연동 테스트</title>
</head>
<body>
  <h2>일정 불러오기 테스트</h2>
  <div id="output">불러오는 중...</div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://gaigimhrlyvosgbwauxi.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_XdNI8L7FS52uhLvt2xSW1Q_OGtxfn9S';

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const { data, error } = await supabase
      .from('events')
      .select('*')
      .order('sort_order');

    const out = document.getElementById('output');
    if (error) {
      out.textContent = '에러: ' + error.message;
    } else {
      out.innerHTML = data.map(e =>
        `<p><b>${e.time}</b> — ${e.title}<br><small>${e.detail || ''}</small></p>`
      ).join('');
    }
  </script>
</body>
</html>
