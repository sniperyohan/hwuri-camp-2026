<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 스케줄러 만들기</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  *{box-sizing:border-box;}
  body{font-family:-apple-system,'Malgun Gothic',sans-serif; background:#f4f6f9; margin:0; color:#2b2f38;}
  .wrap{max-width:560px; margin:40px auto; padding:0 16px;}
  h1{font-size:22px; margin:0 0 4px;}
  .sub{color:#8a90a0; font-size:14px; margin-bottom:24px;}
  .card{background:#fff; border-radius:14px; padding:22px; box-shadow:0 2px 12px rgba(0,0,0,.05);}
  label{display:block; font-weight:600; font-size:14px; margin:14px 0 6px;}
  input{width:100%; padding:11px 12px; font-size:15px; border:1px solid #dde1e8; border-radius:8px; font-family:inherit;}
  .hint{font-size:12px; color:#8a90a0; margin-top:4px;}
  .btn{margin-top:22px; width:100%; padding:13px; font-size:16px; font-weight:600; border:none; border-radius:9px; background:#4a7c59; color:#fff; cursor:pointer;}
  .btn:hover{background:#3d6849;}
  #login{max-width:340px; margin:80px auto; text-align:center;}
  #login input{margin-bottom:12px;}
  .result{margin-top:20px; padding:16px; background:#eef5f0; border-radius:10px; display:none;}
  .result a{display:block; margin:8px 0; color:#4a7c59; word-break:break-all; font-size:14px;}
  .result b{font-size:14px;}
  .loading{text-align:center; color:#8a90a0; padding:40px;}
</style>
</head>
<body>

<div id="login" style="display:none;">
  <h2>🔒 관리자 로그인</h2>
  <input type="email" id="email" placeholder="이메일" autocomplete="username">
  <input type="password" id="pw" placeholder="비밀번호" onkeydown="if(event.key==='Enter')tryLogin()">
  <button class="btn" onclick="tryLogin()">로그인</button>
</div>

<div id="app" style="display:none;">
  <div class="wrap">
    <h1>＋ 새 스케줄러 만들기</h1>
    <div class="sub">각 부서에 뿌릴 일정표 페이지를 만듭니다.</div>
    <div class="card">
      <label>스케줄러 제목</label>
      <input type="text" id="title" placeholder="예: 청년부 여름 수련회">
      <label>부제목</label>
      <input type="text" id="subtitle" placeholder="예: 강릉 2박 3일">
      <label>시작일</label>
      <input type="date" id="start_date">
      <label>종료일</label>
      <input type="date" id="end_date">
      <label>주소(slug)</label>
      <input type="text" id="slug" placeholder="예: youth-2026">
      <div class="hint">영문 소문자·숫자·하이픈(-)만 사용하세요. 링크 주소에 들어갑니다.</div>
      <div id="ownerBox" style="display:none;">
        <label>담당 계정 (슈퍼관리자 전용)</label>
        <select id="ownerSel" style="width:100%; padding:11px 12px; font-size:15px; border:1px solid #dde1e8; border-radius:8px; font-family:inherit;"></select>
      </div>
      <button class="btn" onclick="createCamp()">스케줄러 만들기</button>
      <div class="result" id="result"></div>
    </div>
  </div>
</div>

<script>

const SUPER_ADMIN = 'bcc871ee-6e51-4f24-92d9-b4a72572135c';

async function init(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ document.getElementById('app').style.display=''; await fillOwners(); }
  else { document.getElementById('login').style.display=''; }
}
init();

async function fillOwners(){
  const { data:{ user } } = await sb.auth.getUser();
  if(!user || user.id !== SUPER_ADMIN) return;
  const { data: accs } = await sb.from('account_labels').select('*').order('label');
  const sel = document.getElementById('ownerSel');
  sel.innerHTML = (accs||[]).map(a =>
    `<option value="${a.user_id}"${a.user_id===user.id?' selected':''}>${a.label}${a.email?' ('+a.email+')':''}</option>`
  ).join('');
  document.getElementById('ownerBox').style.display='';
}

async function tryLogin(){
  const email = document.getElementById('email').value;
  const pw = document.getElementById('pw').value;
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if(error){ alert('로그인 실패: '+error.message); return; }
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='';
}

async function createCamp(){
  const title = document.getElementById('title').value.trim();
  const subtitle = document.getElementById('subtitle').value.trim();
  const start_date = document.getElementById('start_date').value || null;
  const end_date = document.getElementById('end_date').value || null;
  const slug = document.getElementById('slug').value.trim().toLowerCase();

  if(!title){ alert('제목을 입력하세요.'); return; }
  if(!slug){ alert('주소(slug)를 입력하세요.'); return; }
  if(!/^[a-z0-9-]+$/.test(slug)){ alert('주소는 영문 소문자·숫자·하이픈만 가능합니다.'); return; }

  // 중복 체크
  const { data: exist } = await sb.from('camps').select('id').eq('slug', slug).maybeSingle();
  if(exist){ alert('이미 사용 중인 주소입니다. 다른 주소를 입력하세요.'); return; }

  const { data:{ user } } = await sb.auth.getUser();
  const sel = document.getElementById('ownerSel');
  const owner = (user.id === SUPER_ADMIN && sel && sel.value) ? sel.value : user.id;
  const { error } = await sb.from('camps').insert({ title, subtitle, start_date, end_date, slug, owner });
  if(error){ alert('생성 실패: '+error.message); return; }

  const base = location.href.replace(/new\.html.*$/, '');
  const viewUrl = `${base}camp.html?c=${slug}`;
  const adminUrl = `${base}admin.html?c=${slug}`;
  const box = document.getElementById('result');
  box.style.display = 'block';
  box.innerHTML = `
    <b>✔ "${title}" 스케줄러가 만들어졌어요!</b>
    <div style="margin-top:12px;"><b>📱 부서에 뿌릴 링크 (보기용)</b>
    <a href="${viewUrl}" target="_blank">${viewUrl}</a></div>
    <div><b>🔧 담당자 관리 링크 (수정용)</b>
    <a href="${adminUrl}" target="_blank">${adminUrl}</a></div>`;
}
</script>
</body>
</html>
