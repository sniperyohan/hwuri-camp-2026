<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<script src="config.js"></script>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body, .p-title, .p-content{ word-break: keep-all; overflow-wrap: break-word; }
  body{font-family:'Pretendard',sans-serif; margin:0; padding:18px 14px 40px; min-height:100vh; transition:background .4s;}
  .wrap{max-width:760px; margin:0 auto;}

  .switch{display:flex; justify-content:center; gap:0; margin:0 auto 18px; max-width:260px;
    background:rgba(0,0,0,.05); border-radius:30px; padding:4px;}
  .switch button{flex:1; border:none; background:none; padding:8px 10px; border-radius:24px;
    font-size:12.5px; font-weight:700; cursor:pointer; color:#888; font-family:inherit; transition:.2s;}
  .switch button.on{background:#fff; box-shadow:0 2px 8px rgba(0,0,0,.12);}

  .hero{text-align:center; padding:6px 0; user-select:none;}
  .cross{font-size:28px; display:block; margin-bottom:2px; transition:.3s;}
  .hero h1{margin:0; font-weight:800; cursor:pointer; transition:.2s;}
  .hero h1:active{transform:scale(.96);}
  .hero .sub{margin-top:5px; font-weight:500;}
  .dday{display:inline-block; margin-top:12px; padding:8px 20px; font-size:14px; font-weight:700; color:#fff; border-radius:30px;}
  .prog{max-width:340px; margin:16px auto 4px;}
  .prog-track{height:7px; border-radius:10px; overflow:hidden; background:rgba(0,0,0,.08);}
  .prog-fill{height:100%; width:0; border-radius:10px; transition:width 1.2s ease;}
  .prog-txt{text-align:center; font-size:11.5px; margin-top:5px; font-weight:600; opacity:.75;}
  body[data-theme="soft"] .dday{background:#5e8a68;}
  body[data-theme="soft"] .prog-fill{background:#5e8a68;}
  body[data-theme="simple"] .dday{background:#4a5b7c;}
  body[data-theme="simple"] .prog-fill{background:#4a5b7c;}
  body[data-theme="dark"] .dday{background:#7fb0e0; color:#12161c;}
  body[data-theme="dark"] .prog-fill{background:#7fb0e0;}

  .tabs{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:20px 0 18px;}
  .tab{border:none; padding:9px 15px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; transition:.2s;}

  .panel{display:none;}
  .panel.active{display:block; animation:fade .45s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(12px);}to{opacity:1; transform:translateY(0);}}
  .day-head{display:flex; align-items:center; gap:9px; font-weight:800; padding:4px 6px 14px;}
  .day-head .badge{font-size:20px;}

  .item{position:relative; padding:15px 17px; margin-bottom:11px; transition:transform .22s, box-shadow .22s, border-color .2s; opacity:0; transform:translateY(14px);}
  .item.show{opacity:1; transform:translateY(0);}
  .now-tag{display:block; width:fit-content; font-size:12px; font-weight:900; color:#fff; background:#a78bfa; padding:3px 12px; border-radius:12px; margin:0 0 8px 0; vertical-align:middle; letter-spacing:.5px; box-shadow:0 0 0 0 rgba(167,139,250,.6); animation:nowShake 1.1s ease-in-out infinite, nowPulse 1.6s ease-out infinite;}
  @keyframes nowShake{0%,100%{transform:rotate(0deg) translateX(0)}15%{transform:rotate(-6deg) translateX(-2px)}30%{transform:rotate(6deg) translateX(2px)}45%{transform:rotate(-4deg) translateX(-1px)}60%{transform:rotate(4deg) translateX(1px)}75%{transform:rotate(0deg) translateX(0)}}
  @keyframes nowPulse{0%{box-shadow:0 0 0 0 rgba(167,139,250,.55)}70%{box-shadow:0 0 0 10px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}
  .item.now{outline:2px solid #a78bfa; outline-offset:2px;}
  .time{font-size:12.5px; font-weight:800; letter-spacing:.3px;}
  .title{font-size:16px; font-weight:800; margin:4px 0 7px; letter-spacing:-.3px;}
  .row{font-size:14px; line-height:1.65; margin:5px 0; display:flex; gap:7px; align-items:flex-start;}
  .row .ic{flex:0 0 auto;}
  .note{font-size:12.5px; margin-top:14px; line-height:1.65; padding:12px 14px;}
  .footer{text-align:center; font-size:12px; margin-top:26px; line-height:1.7;}
  .loading{text-align:center; padding:40px 0; color:#999; font-weight:600;}

  /* ===== SOFT ===== */
  body[data-theme="soft"]{
    --theme:#7fa886; --theme-soft:#eef4ee; --theme-deep:#5e8a68;
    color:#4a4038;
    background:linear-gradient(170deg,#fbf6ee 0%,#f4f0e9 100%); background-attachment:fixed;
  }
  body[data-theme="soft"] .cross{opacity:.85;}
  body[data-theme="soft"] .hero h1{font-size:25px; letter-spacing:-.5px;}
  body[data-theme="soft"] .hero .sub{color:#8a7d70; font-size:13.5px;}
  body[data-theme="soft"] .tab{background:#fffdf9; color:#8a7d70; border-radius:24px; box-shadow:0 2px 8px rgba(120,100,80,.1);}
  body[data-theme="soft"] .tab:hover{transform:translateY(-2px);}
  body[data-theme="soft"] .tab.active{background:var(--theme); color:#fff; box-shadow:0 6px 16px -4px var(--theme);}
  body[data-theme="soft"] .day-head{font-size:17px; color:var(--theme-deep);}
  body[data-theme="soft"] .item{background:#fffdf9; border-radius:16px; margin-left:20px; box-shadow:0 3px 14px rgba(120,100,80,.09);}
  body[data-theme="soft"] .item::before{content:""; position:absolute; left:-20px; top:22px; width:11px; height:11px; background:var(--theme); border-radius:50%; box-shadow:0 0 0 4px var(--theme-soft);}
  body[data-theme="soft"] .item::after{content:""; position:absolute; left:-15px; top:33px; bottom:-11px; width:2px; background:#e5ddd0;}
  body[data-theme="soft"] .item:last-child::after{display:none;}
  body[data-theme="soft"] .item:hover{transform:translateY(-3px) scale(1.008); box-shadow:0 10px 24px -6px rgba(120,100,80,.22);}
  body[data-theme="soft"] .item.now{box-shadow:0 6px 20px -4px rgba(167,139,250,.4); outline:2px solid #a78bfa; outline-offset:2px;}
  body[data-theme="soft"] .now-tag{background:var(--theme-deep);}
  body[data-theme="soft"] .time{color:var(--theme-deep);}
  body[data-theme="soft"] .title{color:#4a4038;}
  body[data-theme="soft"] .row{color:#8a7d70;}
  body[data-theme="soft"] .row b{color:#4a4038; font-weight:700;}
  body[data-theme="soft"] .footer{color:#b8ac9d;}

  /* ===== SIMPLE ===== */
  body[data-theme="simple"]{
    --accent:#4a5b7c; --accent-soft:#eef1f6; --line:#e8eaee;
    color:#1f2430; background:#fff;
  }
  body[data-theme="simple"] .cross{opacity:.55; font-size:22px; color:#4a5b7c;}
  body[data-theme="simple"] .hero h1{font-size:22px; letter-spacing:-.6px; color:#1f2430;}
  body[data-theme="simple"] .hero .sub{color:#8a909c; font-size:13px;}
  body[data-theme="simple"] .tab{background:transparent; color:#8a909c; border-radius:6px; border:1px solid var(--line);}
  body[data-theme="simple"] .tab:hover{border-color:var(--accent); color:var(--accent);}
  body[data-theme="simple"] .tab.active{background:var(--accent); color:#fff; border-color:var(--accent);}
  body[data-theme="simple"] .day-head{font-size:15px; color:#1f2430; border-bottom:2px solid #1f2430; margin:0 4px 14px; padding-bottom:10px;}
  body[data-theme="simple"] .day-head .badge{font-size:16px; filter:grayscale(.3);}
  body[data-theme="simple"] .item{background:#fff; border:1px solid var(--line); border-radius:8px; border-left:3px solid transparent;}
  body[data-theme="simple"] .item:hover{border-left-color:var(--accent); box-shadow:0 4px 14px rgba(30,40,60,.07); transform:translateY(-1px);}
  body[data-theme="simple"] .item.now{background:var(--accent-soft); outline:2px solid #a78bfa; outline-offset:2px;}
  body[data-theme="simple"] .now-tag{background:var(--accent); border-radius:4px;}
  body[data-theme="simple"] .time{color:var(--accent);}
  body[data-theme="simple"] .title{color:#1f2430; font-weight:700;}
  body[data-theme="simple"] .row{color:#5c6270;}
  body[data-theme="simple"] .row b{color:#1f2430;}
  body[data-theme="simple"] .footer{color:#b4b9c2;}

  /* ===== DARK ===== */
  body[data-theme="dark"]{
    --accent:#7fb0e0; --accent-soft:#1e2a3a; --line:#2a3340;
    background:#12161c; color:#dbe3ec;
  }
  body[data-theme="dark"] .cross{opacity:.6; font-size:22px; color:#7fb0e0;}
  body[data-theme="dark"] .hero h1{font-size:23px; letter-spacing:-.5px; color:#eef3f9;}
  body[data-theme="dark"] .hero .sub{color:#8b95a3; font-size:13px;}
  body[data-theme="dark"] .tab{background:#1a212a; color:#9aa4b2; border-radius:8px; border:1px solid var(--line);}
  body[data-theme="dark"] .tab:hover{border-color:var(--accent); color:var(--accent);}
  body[data-theme="dark"] .tab.active{background:var(--accent); color:#12161c; border-color:var(--accent); font-weight:700;}
  body[data-theme="dark"] .day-head{font-size:16px; color:#eef3f9; border-bottom:2px solid #7fb0e0; margin:0 4px 14px; padding-bottom:10px;}
  body[data-theme="dark"] .day-head .badge{font-size:16px;}
  body[data-theme="dark"] .item{background:#1a212a; border:1px solid var(--line); border-radius:10px; border-left:3px solid transparent;}
  body[data-theme="dark"] .item:hover{border-left-color:var(--accent); box-shadow:0 6px 18px rgba(0,0,0,.4); transform:translateY(-1px);}
  body[data-theme="dark"] .item.now{background:var(--accent-soft); outline:2px solid #a78bfa; outline-offset:2px;}
  body[data-theme="dark"] .now-tag{background:var(--accent); color:#12161c; border-radius:4px;}
  body[data-theme="dark"] .time{color:var(--accent);}
  body[data-theme="dark"] .title{color:#eef3f9; font-weight:700;}
  body[data-theme="dark"] .row{color:#b3bcc8;}
  body[data-theme="dark"] .row b{color:#eef3f9;}
  body[data-theme="dark"] .footer{color:#6b7684;}
  .prayer-head{text-align:center; font-size:18px; font-weight:800; margin:0 0 14px;}
  .prayer-card{
    border:1px solid rgba(0,0,0,.08);
    border-radius:14px; padding:14px 16px; margin-bottom:10px;
    background:rgba(0,0,0,.02);
    opacity:0; transform:translateY(8px); transition:.4s;
  }
  .prayer-card.show{opacity:1; transform:none;}
  .prayer-card .p-title{font-weight:700; margin-bottom:6px;}
  .prayer-card .p-content{font-size:14px; line-height:1.6; white-space:pre-wrap;}
  .prayer-locked{
    border:1px dashed rgba(0,0,0,.15);
    border-radius:14px; padding:16px; margin-bottom:10px;
    text-align:center; color:#999; font-size:14px;
    background:rgba(0,0,0,.015);
  }
  body[data-theme="dark"] .prayer-card{border-color:rgba(255,255,255,.1); background:rgba(255,255,255,.04);}
  body[data-theme="dark"] .prayer-locked{border-color:rgba(255,255,255,.15); background:rgba(255,255,255,.03); color:#8b95a3;}
  .tab-divider{display:inline-flex; align-items:center; align-self:center; margin:0 6px; color:rgba(0,0,0,.3); font-size:16px; line-height:1;}
  .tab-divider::before{content:"•";}
  .tab-prayer{border:1px dashed rgba(94,138,104,.6) !important;}
</style>
</head>
<body data-theme="soft">
<div class="wrap">
  <div class="switch">
    <button id="btnSoft" class="on" data-th="soft">🌿 부드럽게</button>
    <button id="btnSimple" data-th="simple">▫️ 심플하게</button>
    <button id="btnDark" data-th="dark">🌙 다크모드</button>
  </div>

  <div class="hero">
    <span class="cross">✝</span>
    <h1 id="camp-title">일정</h1>
    <div class="sub" id="camp-sub"></div>
    <div class="dday" id="dday" style="display:none;"></div>
    <div class="prog" id="prog" style="display:none;">
      <div class="prog-track"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-txt" id="progTxt"></div>
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="tabs" id="tabs2"></div>
  <div class="tabs" id="tabs3"></div>
  <div id="content"><div class="loading">불러오는 중...</div></div>

  <div class="footer" id="footer">
    버그 문의 &nbsp;언약가정부 01029740933
  </div>
</div>

<script>
(async function(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('c');
  const content = document.getElementById('content');

  // ===== 테마 전환 =====
  const body = document.body;
  const bSoft = document.getElementById('btnSoft');
  const bSimple = document.getElementById('btnSimple');
  const bDark = document.getElementById('btnDark');
  function setTheme(th){
    body.setAttribute('data-theme', th);
    bSoft.classList.toggle('on', th==='soft');
    bSimple.classList.toggle('on', th==='simple');
    bDark.classList.toggle('on', th==='dark');
    try{ localStorage.setItem('camp-theme', th); }catch(e){}
  }
  bSoft.addEventListener('click', ()=>setTheme('soft'));
  bSimple.addEventListener('click', ()=>setTheme('simple'));
  bDark.addEventListener('click', ()=>setTheme('dark'));
  try{ const saved=localStorage.getItem('camp-theme'); if(saved) setTheme(saved); }catch(e){}

  if(!slug){
    content.innerHTML = '<div class="loading">수련회를 지정해주세요.<br>예: ?c=hwuri-2026</div>';
    return;
  }

  // config.js의 전역 sb 사용
  const { data: camp, error: campErr } = await sb
    .from('camps').select('*').eq('slug', slug).single();
  if(campErr || !camp){
    content.innerHTML = '<div class="loading">수련회를 찾을 수 없습니다.</div>';
    return;
  }
  document.getElementById('camp-title').textContent = camp.title || '일정';
  document.getElementById('camp-sub').textContent = camp.subtitle || '';
  document.title = camp.title || '수련회 일정';

  const { data: events, error: evErr } = await sb
    .from('events').select('*')
    .eq('camp_id', camp.id)
    .order('event_date', {ascending:true})
    .order('sort_order', {ascending:true});
  if(evErr){
    content.innerHTML = '<div class="loading">일정을 불러오지 못했습니다.</div>';
    return;
  }

  const byDate = {};
  events.forEach(e=>{ (byDate[e.event_date] ||= []).push(e); });
  let DAYS = camp && camp.days;
  if(typeof DAYS === 'string'){ try{ DAYS = JSON.parse(DAYS); }catch(e){ DAYS = null; } }
  if(!Array.isArray(DAYS)) DAYS = [];
  const found = Object.keys(byDate);
  const datesSorted = found.slice().sort();
  const dates = DAYS.filter(d=>found.includes(d));
  datesSorted.forEach(d=>{ if(!dates.includes(d)) dates.push(d); });

  function updateProgress(){
    const ddayEl = document.getElementById('dday');
    const progEl = document.getElementById('prog');
    const fillEl = document.getElementById('progFill');
    const txtEl  = document.getElementById('progTxt');
    if(dates.length === 0) return;

    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const start = new Date(datesSorted[0] + 'T00:00:00');
    const end   = new Date(datesSorted[datesSorted.length-1] + 'T00:00:00');

    // 시작 전: D-day 카운트
    if(today < start){
      const diff = Math.ceil((start - today) / 86400000);
      ddayEl.textContent = 'D-' + diff;
      ddayEl.style.display = 'inline-block';
      progEl.style.display = 'none';
      return;
    }
    // 종료 후
    if(today > end){
      ddayEl.textContent = '수련회 종료 🙏';
      ddayEl.style.display = 'inline-block';
      progEl.style.display = 'none';
      return;
    }
    // 기간 중: 며칠째 + 오늘 시간 진행률
    const dayNum = Math.round((today - start) / 86400000) + 1;
    ddayEl.textContent = dayNum + '일차 · 진행 중';
    ddayEl.style.display = 'inline-block';

    const _lds = (dt)=>{ const d=dt||new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
    const todayList = (byDate[dates.find(d=>d===_lds(now))] || byDate[dates[0]] || []);
    const times = (byDate[_lds(now)] || []).map(e=>e.time).filter(Boolean);
    if(times.length >= 1){
      const toMin = t => { const [h,m] = t.split(/[:\-~]/).map(Number); return h*60 + (m||0); };
      const first = toMin(times[0]);
      const lastT = times[times.length-1];
      const last  = toMin(lastT.includes('-')||lastT.includes('~') ? lastT.split(/[\-~]/)[1] : lastT);
      const nowMin = now.getHours()*60 + now.getMinutes();
      let pct = ((nowMin - first) / (last - first)) * 100;
      pct = Math.max(0, Math.min(100, pct));
      fillEl.style.width = pct + '%';
      txtEl.textContent = '오늘 일정 ' + Math.round(pct) + '% 진행';
      progEl.style.display = 'block';
    } else {
      progEl.style.display = 'none';
    }
  }
  updateProgress();
  const WEEK = ['일','월','화','수','목','금','토'];
  const tabsEl = document.getElementById('tabs');
  const SURVEY_URL = 'survey.html?c=' + slug;
  const localDateStr = (dt)=>{ const d=dt||new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
  const todayStr = localDateStr();

  function fmtTab(d){
    const dt = new Date(d+'T00:00:00');
    return `${dt.getMonth()+1}/${dt.getDate()}(${WEEK[dt.getDay()]})`;
  }

  let PRAYERS = [];
  let LOCKED = {};
  let TABS = [];
  function getTabs(){
    let t = camp && camp.tabs;
    if(typeof t === 'string'){ try{ t = JSON.parse(t); }catch(e){ t = null; } }
    if(!Array.isArray(t) || !t.length) t = [{ id:'t1', name:(camp && camp.prayer_label) || '기도' }];
    return t;
  }
  async function loadPrayers(campId){
    const { data, error } = await sb.from('prayers')
      .select('id, title, content, is_public, sort_order, tab_id')
      .eq('camp_id', campId).order('sort_order', {ascending:true});
    PRAYERS = (error || !data) ? [] : data;
    TABS = getTabs();
    const first = (TABS[0]||{}).id || 't1';
    LOCKED = {};
    const { data: lc } = await sb.rpc('locked_prayer_counts', { p_camp_id: campId });
    (lc||[]).forEach(r=>{ const k = r.tab_id || first; LOCKED[k] = (LOCKED[k]||0) + r.cnt; });
    const shown = TABS.filter(tab => PRAYERS.some(p => (p.tab_id||first) === tab.id) || (LOCKED[tab.id]||0) > 0);
    if(!shown.length) return;
    const divider=document.createElement('span');
    divider.className='tab-divider';
    tabsEl.appendChild(divider);
    shown.forEach(tab=>{
      const b=document.createElement('button');
      b.className='tab tab-prayer'; b.dataset.date='__prayer__'+tab.id;
      b.textContent='🙏 ' + tab.name;
      b.onclick=()=>renderPrayers(tab.id);
      tabsEl.appendChild(b);
    });
  }

  function renderPrayers(tabId){
    const first = (TABS[0]||{}).id || 't1';
    const tid = tabId || first;
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.date==='__prayer__'+tid));
    let html = '';
    const lockedCount = LOCKED[tid] || 0;
    PRAYERS.filter(p => (p.tab_id||first) === tid).forEach(p=>{
      if(p.is_public){
        const title = (p.title||'').replace(/</g,'&lt;');
        const content = (p.content||'').replace(/</g,'&lt;')
          .replace(/&lt;(\/?)(img|a|br)\b([^>]*)>/gi, '<$1$2$3>');
        html += `<div class="prayer-card">
          <div class="p-title">🙏 ${title}</div>
          ${content ? `<div class="p-content">${content}</div>` : ''}
        </div>`;
      }
    });
    for(let i=0; i<lockedCount; i++){
      html += `<div class="prayer-locked">🔒 곧 공개됩니다</div>`;
    }
    content.innerHTML = html || '<div class="loading">아직 공개된 기도제목이 없습니다.</div>';
    content.querySelectorAll('.prayer-card').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('show'), i*80);
    });
  }

  // 상세내용 안의 링크 → 기도제목 탭으로 이동
  window.goPrayer = function(key){
    const norm = s => String(s||'').replace(/\s/g,'');
    const t = (TABS||[]).find(x => x.id===key || norm(x.name)===norm(key));
    if(!t){ alert('탭을 찾을 수 없습니다: ' + key); return; }
    renderPrayers(t.id);
    window.scrollTo({top:0, behavior:'smooth'});
  };

  function render(date){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.date===date));
    const list = byDate[date] || [];
    const now = new Date();
    const nowMin = now.getHours()*60 + now.getMinutes();
    let html = '';
    list.forEach((e,i)=>{
      let isNow=false;
      if(date===todayStr && e.time){
        // "11:00-17:00" 또는 "11:00" 형식 모두 처리
        const parts = e.time.split('-');
        const toMin = (t)=>{ const [h,m]=t.trim().split(':').map(Number); return h*60+(m||0); };
        const start = toMin(parts[0]);
        let end;
        if(parts[1]){ end = toMin(parts[1]); }          // 범위면 끝 시각 사용
        else {                                            // 단일 시각이면 다음 항목 시작을 끝으로
          const next=list[i+1];
          end = (next && next.time) ? toMin(next.time.split('-')[0]) : 24*60;
        }
        if(nowMin>=start && nowMin<end) isNow=true;
      }
      const nowTag = isNow ? '<span class="now-tag">NOW</span>' : '';
      const detail = e.detail
        ? e.detail.split('\n').map(line=>`<div class="row">${line}</div>`).join('')
        : '';
      html += `<div class="item${isNow?' now':''}">
        ${nowTag}
        <div class="time">${e.time||''}</div>
        <div class="title">${e.title||''}</div>
        ${detail}
      </div>`;
    });
    content.innerHTML = html || '<div class="loading">일정이 없습니다.</div>';
    // 카드 등장 애니메이션
    content.querySelectorAll('.item').forEach((el,i)=>{
      setTimeout(()=>el.classList.add('show'), i*60);
    });
    const nowEl = content.querySelector('.item.now');
    if(nowEl) setTimeout(()=>nowEl.scrollIntoView({behavior:'smooth',block:'center'}), 400);
  }

  dates.forEach(d=>{
    const b=document.createElement('button');
    b.className='tab'; b.dataset.date=d; b.textContent=fmtTab(d);
    b.onclick=()=>render(d);
    tabsEl.appendChild(b);
  });

  await loadPrayers(camp.id);

  // 셋째 줄: 설문조사 버튼 (설문이 '받는 중'일 때만 표시)
  const tabsEl3 = document.getElementById('tabs3');
  if(tabsEl3 && typeof SURVEY_URL === 'string' && SURVEY_URL){
    const { data: sv } = await sb.from('surveys')
      .select('is_open').eq('camp_id', camp.id).maybeSingle();
    if(sv && sv.is_open !== false){
      const s=document.createElement('button');
      s.className='tab tab-survey';
      s.textContent='📝 설문조사';
      s.onclick=()=>window.open(SURVEY_URL,'_blank','noopener');
      tabsEl3.appendChild(s);
    }
  }

  const startDate = dates.includes(todayStr) ? todayStr : dates[0];
  if(startDate) render(startDate);
  else content.innerHTML='<div class="loading">일정이 없습니다.</div>';
})();
</script>
</body>
</html>
