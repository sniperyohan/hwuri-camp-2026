<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  *{box-sizing:border-box;}
  body{font-family:'Pretendard',sans-serif; margin:0; padding:20px 14px 60px; background:#f4f5f8; color:#1f2430;}
  .wrap{max-width:860px; margin:0 auto;}
  h1{font-size:20px; margin:0 0 4px;}
  .sub{color:#8a909c; font-size:13px; margin-bottom:20px;}

  #login{max-width:340px; margin:80px auto; background:#fff; border-radius:14px; padding:30px 26px; box-shadow:0 4px 20px rgba(0,0,0,.06); text-align:center;}
  #login h2{font-size:17px; margin:0 0 16px;}
  #login input{width:100%; padding:11px 12px; font-size:15px; border:1px solid #dde1e8; border-radius:8px; margin-bottom:12px; font-family:inherit;}
  #login button{width:100%; padding:11px; font-size:14px; font-weight:700; color:#fff; background:#4a5b7c; border:none; border-radius:8px; cursor:pointer;}
  #login .err{color:#d64545; font-size:12.5px; min-height:16px; margin-top:2px;}

  #app{display:none;}
  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .btn{border:none; border-radius:8px; padding:8px 14px; font-size:13px; font-weight:700; cursor:pointer;}
  .btn-primary{background:#4a5b7c; color:#fff;}
  .btn-add{background:#5e8a68; color:#fff;}
  .btn-del{background:#d64545; color:#fff;}
  .btn-ghost{background:#eef1f6; color:#4a5b7c;}
  .btn-logout{background:#e8eaee; color:#5c6270;}

  select, input, textarea{font-family:inherit; font-size:14px; border:1px solid #dde1e8; border-radius:8px; padding:8px 10px;}
  textarea{width:100%; min-height:70px; resize:vertical; line-height:1.5;}

  /* 날짜 탭 */
  .tabs{display:flex; align-items:center; gap:7px; overflow-x:auto; padding-bottom:8px; margin-bottom:16px;}
  .tab{white-space:nowrap; background:#fff; border:1px solid #dde1e8; border-radius:20px; padding:8px 15px; font-size:13px; font-weight:700; cursor:pointer; color:#8a909c;}
  .tab.active{background:#4a5b7c; color:#fff; border-color:#4a5b7c;}
  .tab.addtab{background:#eef4ee; color:#5e8a68; border-color:#cfe0cf;}

  .bar{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; background:#fff; padding:12px 14px; border-radius:12px;}
  .bar label{font-size:13px; font-weight:600; color:#5c6270;}

  .card{background:#fff; border:1px solid #e8eaee; border-radius:10px; padding:14px; margin-bottom:10px;}
  .card .fields{display:grid; grid-template-columns:110px 1fr; gap:8px; align-items:start;}
  .card .fields .full{grid-column:1 / -1;}
  .emoji-row{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .emoji-pick{cursor:pointer; font-size:18px; background:#f4f5f8; border:1px solid #e8eaee; border-radius:6px; padding:2px 6px;}
  .emoji-pick:hover{background:#e8eaee;}
  .card-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:10px;}
  .loading{text-align:center; color:#8a909c; padding:40px;}
  .toggle{display:inline-flex; align-items:center; gap:8px; cursor:pointer; user-select:none;}
  .toggle input{display:none;}
  .toggle .track{width:46px; height:26px; border-radius:20px; background:#ccc; position:relative; transition:.25s;}
  .toggle .track::after{content:''; position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%; background:#fff; transition:.25s;}
  .toggle input:checked + .track{background:#5e8a68;}
  .toggle input:checked + .track::after{transform:translateX(20px);}
  .toggle .lbl{font-size:13px; font-weight:700; color:#666;}
  .tab-divider{display:inline-flex; align-items:center; margin:0 6px; color:#b0b0b0; font-size:16px;}
  .tab-divider::before{content:"•";}
  .tab-prayer{background:#eef3ee !important; border:1px dashed #9bb89b !important;}
  .tab-prayer.active{background:#5e8a68 !important; color:#fff !important; border-style:solid !important;}
</style>
</head>
<body>

<div id="login">
  <h2>🔒 관리자 로그인</h2>
  <input type="email" id="email" placeholder="이메일" autocomplete="username">
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" onkeydown="if(event.key==='Enter')tryLogin()">
  <button onclick="tryLogin()">로그인</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app">
  <div class="wrap">
    <div class="topbar">
      <div>
        <h1 id="campTitle">일정 관리자</h1>
        <div class="sub" id="campSub"></div>
      </div>
      <button class="btn btn-logout" onclick="logout()">로그아웃</button>
    </div>

    <div class="card" id="campEdit" style="display:none;">
      <div class="fields">
        <label>수련회 제목</label><input type="text" id="ct" placeholder="예: 행복한 우리 교회">
        <label>부제목</label><input type="text" id="cs" placeholder="예: 삼척 여름 수련회">
        <label>탭 이름</label><input type="text" id="pl" placeholder="예: 기도 / 나눔 / 공지">
      </div>
      <div class="card-actions">
        <button class="btn btn-primary" onclick="saveCamp()">💾 제목 저장</button>
      </div>
    </div>

    <div class="tabs" id="tabs"></div>

    <div class="bar" id="dayBar">
      <button class="btn btn-add" onclick="addItem()">＋ 이 날짜에 항목 추가</button>
      <button class="btn btn-ghost" onclick="loadList()">↻ 새로고침</button>
    </div>
    <div class="bar" id="prayerBar" style="display:none;">
      <button class="btn btn-add" onclick="addPrayer()">＋ 내용 추가</button>

    </div>

    <div id="list"><div class="loading">불러오는 중...</div></div>
    <div id="prayerList" style="display:none;"></div>
  </div>
</div>

<script>
let CAMP = null;
let ALL = [];          // 전체 일정
let DATES = [];        // 날짜 목록
let CURRENT = null;    // 현재 선택된 날짜
const EMOJIS = ['🌿','🚗','🍚','🙏','⛪','🛏️','🎤','📖','🎮','☀️','🌙','🔥','🎯','📢'];

(async function(){
  const { data:{ session } } = await sb.auth.getSession();
  if(session) showApp();
})();

async function tryLogin(){
  const email = document.getElementById('email').value.trim();
  const pw = document.getElementById('pw').value;
  const errEl = document.getElementById('loginErr');
  errEl.textContent = '로그인 중...';
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if(error){ errEl.textContent = '로그인 실패: 이메일/비밀번호를 확인하세요.'; return; }
  errEl.textContent = '';
  showApp();
}

async function logout(){ await sb.auth.signOut(); location.reload(); }

function showApp(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').style.display='block';
  init();
}

async function init(){
  const params = new URLSearchParams(location.search);
  const slug = params.get('c');
  const list = document.getElementById('list');
  if(!slug){ list.innerHTML='<div class="loading">수련회를 지정해주세요. 예: ?c=hwuri-2026</div>'; return; }

  const { data: camp, error } = await sb.from('camps').select('*').eq('slug', slug).single();
  if(error || !camp){ list.innerHTML='<div class="loading">수련회를 찾을 수 없습니다.</div>'; return; }

  // ===== 권한 체크: 이 캠프의 주인이거나 슈퍼관리자만 통과 =====
  const SUPER_ADMIN = 'bcc871ee-6e51-4f24-92d9-b4a72572135c';
  const { data:{ user } } = await sb.auth.getUser();
  if(!user || (camp.owner !== user.id && user.id !== SUPER_ADMIN)){
    alert('🔒 이 계정은 관리 권한이 없습니다.\n\n담당 계정으로 다시 로그인해 주세요.');
    await sb.auth.signOut();
    location.href = location.pathname + location.search;
    return;
  }
  // ===============================================

  CAMP = camp;
  document.getElementById('campTitle').textContent = (camp.title||'') + ' — 관리';
  document.getElementById('campSub').textContent = camp.subtitle || '';
  document.getElementById('ct').value = camp.title || '';
  document.getElementById('cs').value = camp.subtitle || '';
  const plEl = document.getElementById('pl');
  if(plEl){ plEl.value = camp.prayer_label || '기도'; plEl.style.display='none'; const lb = plEl.previousElementSibling; if(lb) lb.style.display='none'; }
  document.getElementById('campEdit').style.display = '';
  loadList();
}

async function saveCamp(){
  const title = document.getElementById('ct').value;
  const subtitle = document.getElementById('cs').value;
  const prayer_label = document.getElementById('pl').value || '기도';
  const { error } = await sb.from('camps').update({ title, subtitle, prayer_label }).eq('id', CAMP.id);
  if(error){ alert('제목 저장 실패: '+error.message); return; }
  CAMP.title = title; CAMP.subtitle = subtitle; CAMP.prayer_label = prayer_label;
  document.getElementById('campTitle').textContent = title + ' — 관리';
  document.getElementById('campSub').textContent = subtitle;
  renderTabs();
  alert('✔ 저장되었습니다');
}

async function loadList(){
  const { data: events, error } = await sb.from('events').select('*')
    .eq('camp_id', CAMP.id)
    .order('event_date',{ascending:true})
    .order('sort_order',{ascending:true});
  if(error){ document.getElementById('list').innerHTML='<div class="loading">불러오기 실패</div>'; return; }

  ALL = events;
  DATES = mergeDays([...new Set(events.map(e=>e.event_date))]);
  if(!CURRENT || !DATES.includes(CURRENT)) CURRENT = DATES[0] || null;
  renderTabs();
  loadPrayers();
  renderDay();
}

const WEEK = ['일','월','화','수','목','금','토'];
function fmtTab(d){ const dt=new Date(d+'T00:00:00'); return `${dt.getMonth()+1}/${dt.getDate()}(${WEEK[dt.getDay()]})`; }

let VIEW = 'day';  // 'day' 또는 'prayer'
let CURRENT_TAB = null;
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function getTabs(){
  let t = CAMP && CAMP.tabs;
  if(typeof t === 'string'){ try{ t = JSON.parse(t); }catch(e){ t = null; } }
  if(!Array.isArray(t) || !t.length) t = [{ id:'t1', name:(CAMP&&CAMP.prayer_label)||'기도' }];
  return t;
}
async function saveTabs(tabs){
  const { error } = await sb.from('camps').update({ tabs }).eq('id', CAMP.id);
  if(error){ alert('탭 저장 실패: '+error.message); return false; }
  CAMP.tabs = tabs;
  return true;
}

function mergeDays(found){
  let d = CAMP && CAMP.days;
  if(typeof d === 'string'){ try{ d = JSON.parse(d); }catch(e){ d = null; } }
  if(!Array.isArray(d)) d = [];
  const out = d.filter(x=>typeof x === 'string');
  found.slice().sort().forEach(x=>{ if(!out.includes(x)) out.push(x); });
  return out;
}
async function saveDays(days){
  const { error } = await sb.from('camps').update({ days }).eq('id', CAMP.id);
  if(error){ alert('날짜 순서 저장 실패: '+error.message); return false; }
  CAMP.days = days;
  return true;
}
async function moveDate(dir){
  const i = DATES.indexOf(CURRENT), j = i + dir;
  if(i < 0 || j < 0 || j >= DATES.length) return;
  DATES[i] = DATES[j]; DATES[j] = CURRENT;
  renderTabs(); renderDay();
  await saveDays(DATES);
}

function renderTabs(){
  const t = document.getElementById('tabs');
  let html='';
  DATES.forEach(d=>{
    html += `<button class="tab${(VIEW==='day'&&d===CURRENT)?' active':''}" onclick="selectDay('${d}')">${fmtTab(d)}</button>`;
  });
  html += `<button class="tab addtab" onclick="addNewDate()">＋ 날짜</button>`;
  html += `<span class="tab-divider"></span>`;
  getTabs().forEach(tab=>{
    const on = (VIEW==='prayer' && tab.id===CURRENT_TAB);
    html += `<button class="tab tab-prayer${on?' active':''}" onclick="selectPrayer('${tab.id}')">🙏 ${esc(tab.name)}</button>`;
  });
  html += `<button class="tab addtab" onclick="addTab()">＋ 탭</button>`;
  t.innerHTML = html;
}

function selectDay(d){
  flushSave();
  VIEW='day'; CURRENT=d;
  document.getElementById('dayBar').style.display='';
  document.getElementById('prayerBar').style.display='none';
  document.getElementById('list').style.display='';
  document.getElementById('prayerList').style.display='none';
  renderTabs(); renderDay();
}

function selectPrayer(tabId){
  flushSave();
  CURRENT_TAB = tabId || (getTabs()[0]||{}).id;
  VIEW='prayer';
  document.getElementById('dayBar').style.display='none';
  document.getElementById('prayerBar').style.display='';
  document.getElementById('list').style.display='none';
  document.getElementById('prayerList').style.display='';
  renderTabs(); loadPrayers();
}

function addNewDate(){
  const d = prompt('새 날짜를 입력하세요 (YYYY-MM-DD)', CURRENT || '');
  if(!d) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)){ alert('YYYY-MM-DD 형식으로 입력하세요.'); return; }
  CURRENT = d;
  if(!DATES.includes(d)){ DATES.push(d); saveDays(DATES); }
  renderTabs();
  renderDay();
}

async function renameDate(){
  if(!CURRENT) return;
  const nd = prompt('날짜 변경 (YYYY-MM-DD)', CURRENT);
  if(!nd || nd===CURRENT) return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(nd)){ alert('YYYY-MM-DD 형식으로 입력하세요.'); return; }
  if(DATES.includes(nd) && !confirm(`${fmtTab(nd)}가 이미 있습니다. 두 날짜의 일정이 합쳐집니다. 계속할까요?`)) return;
  const items = ALL.filter(e=>e.event_date===CURRENT);
  if(items.length){
    const { error } = await sb.from('events').update({ event_date: nd }).eq('camp_id', CAMP.id).eq('event_date', CURRENT);
    if(error){ alert('날짜 변경 실패: '+error.message); return; }
    items.forEach(e=>{ e.event_date = nd; });
  }
  const pos = DATES.indexOf(CURRENT);
  if(DATES.includes(nd)) DATES = DATES.filter(d=>d!==CURRENT);
  else DATES[pos] = nd;
  CURRENT = nd;
  renderTabs(); renderDay();
  await saveDays(DATES);
}

async function deleteDate(){
  if(!CURRENT) return;
  if(DATES.length<=1){ alert('마지막 날짜는 삭제할 수 없습니다.'); return; }
  const items = ALL.filter(e=>e.event_date===CURRENT);
  const msg = items.length
    ? `${fmtTab(CURRENT)}의 일정 ${items.length}개가 함께 삭제됩니다. 계속할까요?`
    : `${fmtTab(CURRENT)}를 삭제할까요?`;
  if(!confirm(msg)) return;
  if(items.length){
    const { error } = await sb.from('events').delete().eq('camp_id', CAMP.id).eq('event_date', CURRENT);
    if(error){ alert('삭제 실패: '+error.message); return; }
    ALL = ALL.filter(e=>e.event_date!==CURRENT);
  }
  const idx = DATES.indexOf(CURRENT);
  DATES = DATES.filter(d=>d!==CURRENT);
  CURRENT = DATES[Math.max(0, idx-1)] || DATES[0] || null;
  renderTabs(); renderDay();
  await saveDays(DATES);
}

function renderDay(){
  const list = document.getElementById('list');
  if(!CURRENT){ list.innerHTML='<div class="loading">일정이 없습니다. ＋날짜로 시작하세요.</div>'; return; }
  const items = ALL.filter(e=>e.event_date===CURRENT);
  const di = DATES.indexOf(CURRENT);
  const head = `<div class="bar" style="justify-content:space-between; align-items:center; margin-bottom:10px;"><b>📅 ${fmtTab(CURRENT)}</b><div style="display:flex; gap:6px;"><button class="btn btn-ghost" onclick="moveDate(-1)" ${di<=0?'disabled style="opacity:.3;"':''}>◀</button><button class="btn btn-ghost" onclick="moveDate(1)" ${di>=DATES.length-1?'disabled style="opacity:.3;"':''}>▶</button><button class="btn btn-ghost" onclick="renameDate()">✏ 날짜 변경</button><button class="btn btn-ghost" onclick="deleteDate()" ${DATES.length<=1?'disabled style="opacity:.3;"':''}>🗑 날짜 삭제</button></div></div>`;
  if(items.length===0){ list.innerHTML = head + '<div class="loading">이 날짜엔 아직 일정이 없습니다. 아래 ＋버튼으로 추가하세요.</div>'; return; }
  list.innerHTML = head + items.map(cardHtml).join('');
}

function cardHtml(e, i, arr){
  const picks = EMOJIS.map(em=>`<span class="emoji-pick" onclick="addEmoji(${e.id},'${em}')">${em}</span>`).join('');
  return `<div class="card" data-id="${e.id}">
    <div class="fields">
      <label>시간</label><input type="text" class="f-time" value="${escAttr(e.time)}" placeholder="예: 09:00-10:00" oninput="queueSave(this,${e.id})">
      <label>제목</label><input type="text" class="f-title" value="${escAttr(e.title)}" placeholder="일정 제목" onfocus="setActive(this)" oninput="queueSave(this,${e.id})">
      <label class="full">상세내용</label>
      <textarea class="f-detail full" placeholder="줄바꿈으로 여러 줄 입력 가능" onfocus="setActive(this)" oninput="queueSave(this,${e.id})">${escText(e.detail)}</textarea>
      <label class="full">이모지 넣기 <span style="font-weight:400;color:#8a90a0;font-size:12px;">(제목이나 상세 칸을 클릭한 뒤 이모지를 누르세요)</span></label>
      <div class="emoji-row full">${picks}</div>
      <input type="hidden" class="f-sort" value="${e.sort_order??0}">
    </div>
    <div class="card-actions">
      <span class="save-state" style="font-size:12px; color:#8a909c; margin-right:auto; align-self:center;"></span>
      <button class="btn btn-ghost" onclick="moveItem(${e.id},-1)" ${i===0?'disabled style="opacity:.3;"':''}>⬆</button>
      <button class="btn btn-ghost" onclick="moveItem(${e.id},1)" ${(arr&&i===arr.length-1)?'disabled style="opacity:.3;"':''}>⬇</button>
      <button class="btn btn-primary" onclick="saveItem(this,${e.id})">💾 저장</button>
      <button class="btn btn-del" onclick="delItem(${e.id})">🗑 삭제</button>
    </div>
  </div>`;
}

let ACTIVE_FIELD = null;
function setActive(el){ ACTIVE_FIELD = el; }
function addEmoji(id, em){
  const card = document.querySelector(`.card[data-id="${id}"]`);
  // 이 카드 안의 필드가 활성 상태면 그 커서 위치에 삽입, 아니면 제목칸 끝에 삽입
  let el = ACTIVE_FIELD;
  if(!el || !card.contains(el)){ el = card.querySelector('.f-title'); }
  const s = el.selectionStart ?? el.value.length;
  const eEnd = el.selectionEnd ?? el.value.length;
  el.value = el.value.slice(0, s) + em + el.value.slice(eEnd);
  el.focus();
  const pos = s + em.length;
  el.setSelectionRange(pos, pos);
  ACTIVE_FIELD = el;
}

function escAttr(s){ return (s||'').replace(/"/g,'&quot;'); }
function escText(s){ return (s||'').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

let SAVE_TIMER = null, PENDING = null;
function queueSave(el, id){
  const card = el.closest('.card');
  clearTimeout(SAVE_TIMER);
  PENDING = { card, id };
  const st = card.querySelector('.save-state');
  if(st) st.textContent = '입력 중…';
  SAVE_TIMER = setTimeout(flushSave, 1000);
}
async function flushSave(){
  clearTimeout(SAVE_TIMER);
  if(!PENDING) return;
  const { card, id } = PENDING;
  PENDING = null;
  if(!document.body.contains(card)) return;
  const upd = {
    time: card.querySelector('.f-time').value,
    title: card.querySelector('.f-title').value,
    detail: card.querySelector('.f-detail').value
  };
  const { error } = await sb.from('events').update(upd).eq('id', id);
  const st = card.querySelector('.save-state');
  if(error){ if(st) st.textContent = '⚠ 저장 실패'; return; }
  const item = ALL.find(e=>e.id===id);
  if(item) Object.assign(item, upd);
  if(st){ st.textContent = '✔ 저장됨'; setTimeout(()=>{ if(st.textContent==='✔ 저장됨') st.textContent=''; }, 1500); }
}

async function saveItem(btn, id){
  clearTimeout(SAVE_TIMER); PENDING = null;
  const card = btn.closest('.card');
  const upd = {
    event_date: CURRENT,
    time: card.querySelector('.f-time').value,
    title: card.querySelector('.f-title').value,
    badge: '',
    sort_order: parseInt(card.querySelector('.f-sort').value)||0,
    detail: card.querySelector('.f-detail').value
  };
  const { error } = await sb.from('events').update(upd).eq('id', id);
  if(error){ alert('저장 실패: '+error.message); return; }
  btn.textContent = '✔ 저장됨';
  setTimeout(()=>{ btn.textContent='💾 저장'; loadList(); }, 800);
}

async function delItem(id){
  if(!confirm('이 항목을 삭제할까요?')) return;
  const { error } = await sb.from('events').delete().eq('id', id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  loadList();
}

async function addItem(){
  if(!CURRENT){ alert('먼저 ＋날짜로 날짜를 정하세요.'); return; }
  const cur = ALL.filter(e=>e.event_date===CURRENT);
  const maxOrder = cur.length ? Math.max(...cur.map(e=>e.sort_order||0)) : 0;
  const ins = { camp_id: CAMP.id, event_date: CURRENT, time:'', title:'새 일정', badge:'', detail:'', sort_order: maxOrder + 10 };
  const { error } = await sb.from('events').insert(ins);
  if(error){ alert('추가 실패: '+error.message); return; }
  loadList();
}

// ===== 기도제목 =====
let PRAYERS = [];

async function loadPrayers(){
  await flushPrayerSave();
  if(!CURRENT_TAB) CURRENT_TAB = (getTabs()[0]||{}).id;
  const { data, error } = await sb.from('prayers')
    .select('*').eq('camp_id', CAMP.id).eq('tab_id', CURRENT_TAB).order('sort_order');
  if(error){ document.getElementById('prayerList').innerHTML='<div class="loading">불러오기 실패: '+error.message+'</div>'; return; }
  PRAYERS = data || [];
  renderPrayers();
}

function renderPrayers(){
  const el = document.getElementById('prayerList');
  const tabs = getTabs();
  const tab = tabs.find(t=>t.id===CURRENT_TAB) || tabs[0] || {id:'t1',name:''};
  const head = `<div class="bar" style="justify-content:space-between; align-items:center; margin-bottom:10px;"><b>🙏 ${esc(tab.name)}</b><div style="display:flex; gap:6px;"><button class="btn btn-ghost" onclick="moveTab('${tab.id}',-1)" ${tabs.findIndex(t=>t.id===tab.id)<=0?'disabled style="opacity:.3;"':''}>◀</button><button class="btn btn-ghost" onclick="moveTab('${tab.id}',1)" ${tabs.findIndex(t=>t.id===tab.id)>=tabs.length-1?'disabled style="opacity:.3;"':''}>▶</button><button class="btn btn-ghost" onclick="renameTab('${tab.id}')">✏ 탭 이름</button><button class="btn btn-ghost" onclick="deleteTab('${tab.id}')" ${tabs.length<=1?'disabled style="opacity:.3;"':''}>🗑 탭 삭제</button></div></div>`;
  if(!PRAYERS.length){ el.innerHTML = head + '<div class="loading">아직 내용이 없습니다. ＋추가를 눌러보세요.</div>'; return; }
  el.innerHTML = head + PRAYERS.map((p,i)=>`
    <div class="card" style="margin-bottom:10px; ${p.is_public?'':'opacity:.8;'}">
      <div class="bar" style="justify-content:space-between; align-items:center; margin-bottom:8px;">
        <label class="toggle">
          <input type="checkbox" ${p.is_public?'checked':''} onchange="togglePrayer(${p.id}, this.checked)">
          <span class="track"></span>
          <span class="lbl">${p.is_public?'🌍 공개중':'🔒 비공개'}</span>
        </label>
        <div style="display:flex; gap:6px;">
          <button class="btn btn-ghost" onclick="movePrayer(${p.id}, -1)" ${i===0?'disabled style="opacity:.3;"':''}>⬆</button>
          <button class="btn btn-ghost" onclick="movePrayer(${p.id}, 1)" ${i===PRAYERS.length-1?'disabled style="opacity:.3;"':''}>⬇</button>
          <button class="btn btn-ghost" onclick="delPrayer(${p.id})">🗑 삭제</button>
        </div>
      </div>
      <input id="pt-${p.id}" oninput="queuePrayerSave(${p.id})" value="${(p.title||'').replace(/"/g,'&quot;')}" placeholder="제목" style="width:100%; margin-bottom:6px; font-weight:700;">
      <textarea id="pc-${p.id}" oninput="queuePrayerSave(${p.id})" placeholder="내용" style="width:100%; min-height:60px;">${p.content||''}</textarea>
      <div class="bar" style="margin-top:8px; align-items:center; gap:10px;">
        <button class="btn btn-primary" onclick="savePrayer(${p.id})">💾 저장</button>
        <span id="pst-${p.id}" style="font-size:12px; color:#8a909c;"></span>
      </div>
    </div>`).join('');
}

async function addPrayer(){
  const maxOrder = PRAYERS.length ? Math.max(...PRAYERS.map(p=>p.sort_order||0)) : 0;
  const ins = { camp_id: CAMP.id, tab_id: CURRENT_TAB, title:'새 기도제목', content:'', is_public:false, sort_order: maxOrder + 10 };
  const { error } = await sb.from('prayers').insert(ins);
  if(error){ alert('추가 실패: '+error.message); return; }
  loadPrayers();
}

async function movePrayer(id, dir){
  const idx = PRAYERS.findIndex(p=>p.id===id);
  const swapIdx = idx + dir;
  if(swapIdx < 0 || swapIdx >= PRAYERS.length) return;  // 맨 위/아래면 무시
  const a = PRAYERS[idx], b = PRAYERS[swapIdx];
  // 두 항목의 sort_order를 서로 교환
  const { error:e1 } = await sb.from('prayers').update({ sort_order: b.sort_order }).eq('id', a.id);
  const { error:e2 } = await sb.from('prayers').update({ sort_order: a.sort_order }).eq('id', b.id);
  if(e1||e2){ alert('순서 변경 실패'); return; }
  loadPrayers();
}

async function moveItem(id, dir){
  await flushSave();
  const items = ALL.filter(e=>e.event_date===CURRENT);
  const i = items.findIndex(e=>e.id===id), j = i + dir;
  if(i<0 || j<0 || j>=items.length) return;
  const a = items[i], b = items[j];
  const ao = a.sort_order||0, bo = b.sort_order||0;
  if(ao === bo){ alert('두 항목의 순서 값이 같습니다. 순서 칸에 다른 숫자를 넣고 저장해 주세요.'); return; }
  const { error:e1 } = await sb.from('events').update({ sort_order: bo }).eq('id', a.id);
  const { error:e2 } = await sb.from('events').update({ sort_order: ao }).eq('id', b.id);
  if(e1||e2){ alert('순서 변경 실패'); return; }
  a.sort_order = bo; b.sort_order = ao;
  ALL.sort((x,y)=> x.event_date < y.event_date ? -1 : x.event_date > y.event_date ? 1 : (x.sort_order||0)-(y.sort_order||0));
  renderDay();
}

async function moveTab(id, dir){
  const tabs = getTabs();
  const i = tabs.findIndex(t=>t.id===id), j = i + dir;
  if(i<0 || j<0 || j>=tabs.length) return;
  const tmp = tabs[i]; tabs[i] = tabs[j]; tabs[j] = tmp;
  if(await saveTabs(tabs)){ renderTabs(); renderPrayers(); }
}

let pSaveTimer = null, pSaveId = null;

function queuePrayerSave(id){
  pSaveId = id;
  const st = document.getElementById('pst-'+id);
  if(st) st.textContent = '입력 중…';
  clearTimeout(pSaveTimer);
  pSaveTimer = setTimeout(()=>flushPrayerSave(), 1000);
}

async function flushPrayerSave(){
  clearTimeout(pSaveTimer);
  const id = pSaveId;
  if(!id) return;
  pSaveId = null;
  const te = document.getElementById('pt-'+id);
  const ce = document.getElementById('pc-'+id);
  if(!te || !ce) return;
  const st = document.getElementById('pst-'+id);
  const { error } = await sb.from('prayers')
    .update({ title: te.value, content: ce.value }).eq('id', id);
  if(st) st.textContent = error ? '⚠ 저장 실패' : '✔ 저장됨';
}

async function savePrayer(id){
  const title = document.getElementById('pt-'+id).value;
  const content = document.getElementById('pc-'+id).value;
  const { error } = await sb.from('prayers').update({ title, content }).eq('id', id);
  if(error){ alert('저장 실패: '+error.message); return; }
  loadPrayers();
}

async function togglePrayer(id, makePublic){
  const { error } = await sb.from('prayers').update({ is_public: makePublic }).eq('id', id);
  if(error){ alert('변경 실패: '+error.message); return; }
  loadPrayers();
}

async function delPrayer(id){
  if(!confirm('이 기도제목을 삭제할까요?')) return;
  const { error } = await sb.from('prayers').delete().eq('id', id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  loadPrayers();
}
async function addTab(){
  const name = prompt('새 탭 이름을 입력하세요', '새 탭');
  if(!name || !name.trim()) return;
  const tabs = getTabs().slice();
  let n = 1; while(tabs.some(t=>t.id==='t'+n)) n++;
  const id = 't'+n;
  tabs.push({ id, name: name.trim() });
  if(!await saveTabs(tabs)) return;
  selectPrayer(id);
}
async function renameTab(id){
  const tabs = getTabs().slice();
  const tab = tabs.find(t=>t.id===id); if(!tab) return;
  const name = prompt('탭 이름 변경', tab.name);
  if(!name || !name.trim()) return;
  tab.name = name.trim();
  if(!await saveTabs(tabs)) return;
  renderTabs(); renderPrayers();
}
async function deleteTab(id){
  const tabs = getTabs().slice();
  if(tabs.length <= 1){ alert('마지막 탭은 삭제할 수 없습니다.'); return; }
  const tab = tabs.find(t=>t.id===id); if(!tab) return;
  const { count } = await sb.from('prayers').select('id', { count:'exact', head:true }).eq('camp_id', CAMP.id).eq('tab_id', id);
  if(!confirm(`'${tab.name}' 탭과 그 안의 글 ${count||0}개가 삭제됩니다. 계속할까요?`)) return;
  const { error } = await sb.from('prayers').delete().eq('camp_id', CAMP.id).eq('tab_id', id);
  if(error){ alert('삭제 실패: '+error.message); return; }
  const rest = tabs.filter(t=>t.id!==id);
  if(!await saveTabs(rest)) return;
  selectPrayer(rest[0].id);
}
